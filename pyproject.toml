[project]
name = "doorzo-mcp"
version = "1.0.0"
description = "Doorzo deal monitor: MCP server + web UI for finding good-priced items on doorzo.com (Mercari, Rakuten, Yahoo Auctions, and more) with deal alerts"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "TESTYEE-09" }]
keywords = ["mcp", "doorzo", "proxy-shopping", "japan", "deals", "mercari"]
dependencies = [
    "fastapi>=0.115",
    "fastmcp>=2.0",
    "httpx>=0.27",
    "uvicorn>=0.30",
]

[project.scripts]
doorzo-mcp = "doorzo_mcp.server:main"
doorzo-web = "doorzo_mcp.web:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["doorzo_mcp"]
include-package-data = true

[tool.setuptools.package-data]
doorzo_mcp = ["static/*.html"]
